[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "browser-use"
version = "1.0.0.dev0"
description = "Browser Use, powered by Pi, with Python tools and Cloud browsers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gregor Zunic" }]
dependencies = [
    "browser-harness==0.1.13",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
openai-tools = ["openai>=3.31.0,<4", "pillow>=12,<14"]
anthropic-tools = ["anthropic>=1.17.0,<2", "pillow>=12,<14"]
mcp = ["mcp>=2.1.1,<3"]
cli = []

[project.urls]
Homepage = "https://browser-use.com"
Documentation = "https://docs.browser-use.com"
Repository = "https://github.com/browser-use/browser-use"

[project.scripts]
browser-use = "browser_use.cli:main"
browseruse = "browser_use.cli:main"
bu = "browser_use.cli:main"
browser = "browser_use.cli:main"
browser-use-tui = "browser_use.cli:browser_use_tui_main"

[tool.hatch.build]
artifacts = ["browser_use/runtime/**"]

[tool.hatch.build.targets.wheel]
packages = ["browser_use"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
only-include = [
    "browser_use",
    "src",
    "scripts/build-python.mjs",
    "hatch_build.py",
    "package.json",
    "package-lock.json",
    "tsconfig.json",
    "tsconfig.build.json",
    "LICENSE",
    "README.md",
]

[dependency-groups]
dev = [
    "pre-commit==4.5.1",
    "ruff==0.14.14",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-httpserver==1.1.3",
    "pyright==1.1.408",
]

[tool.ruff]
line-length = 130

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"

[tool.pyright]
typeCheckingMode = "basic"
include = ["browser_use"]
exclude = ["browser_use/runtime"]
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/python"]

[tool.codespell]
ignore-words-list = "bu,ehr,iterm"
skip = "package-lock.json"
