name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      DO_NOT_TRACK: '1'
      ANONYMIZED_TELEMETRY: 'false'
      BROWSER_USE_CHROME_EXECUTABLE: /usr/bin/google-chrome
      BROWSER_USE_TEST_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run build:python
      - run: uv sync --dev --all-extras
      - run: BROWSER_USE_NODE="$(command -v node)" uv run python -m unittest discover -s tests/python -p 'test_client.py' -v
      - run: BROWSER_USE_NODE="$(command -v node)" uv run pytest tests/ci -q
      - run: npm test
