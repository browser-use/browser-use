name: package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-2025
            target: win-x64
    runs-on: ${{ matrix.os }}
    env:
      BROWSER_USE_WHEEL_TARGET: ${{ matrix.target }}
      DO_NOT_TRACK: '1'
      ANONYMIZED_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build:python
      - run: uv build --wheel --out-dir artifacts/python
      - run: uv venv .wheel-test --python 3.11
      - shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            WHEEL_PYTHON=.wheel-test/Scripts/python.exe
          else
            WHEEL_PYTHON=.wheel-test/bin/python
          fi
          uv pip install --python "$WHEEL_PYTHON" artifacts/python/*.whl
          "$WHEEL_PYTHON" -I tests/packaging/test_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.target }}
          path: artifacts/python/*.whl

  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build:python
      - run: uv build --sdist --out-dir artifacts/python
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: artifacts/python/*.tar.gz
