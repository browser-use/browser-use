name: lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check
      - run: uv sync --dev --all-extras
      - run: uv run ruff check browser_use hatch_build.py tests/python
      - run: uv run pre-commit run --all-files --show-diff-on-failure
