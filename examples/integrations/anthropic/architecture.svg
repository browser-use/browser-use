<text x="318" y="528" font-size="15" fill="#13253d">Separate tool beside</text>
<text x="318" y="548" font-size="15" fill="#13253d">the SDK process.</text>
<text x="318" y="568" font-size="14" fill="#33465e">Local compute and files.</text>
