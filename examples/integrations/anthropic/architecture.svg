<path d="M580 490 L596 506 M596 490 L580 506" stroke="#a8461f" stroke-width="3"/>
<text x="606" y="504" font-size="13" font-weight="700" letter-spacing="1" fill="#8a3a18">HOST FILE BOUNDARY</text>
<text x="580" y="534" font-size="14" fill="#13253d">Files in outputs/ stay on</text>
<text x="580" y="554" font-size="14" fill="#13253d">the SDK host. Bash does</text>
<text x="580" y="574" font-size="14" fill="#13253d">not copy files to a</text>
