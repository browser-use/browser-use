<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">A browser inside your agent loop</title>
  <desc id="desc">Editorial systems illustration. A user task enters an agent loop formed by the Anthropic Python SDK tool_runner and the BrowserUse driver. The runner sends structured browser actions to the driver, which implements 31 structured browser actions and is not a code interpreter. Browser state and results return to the runner. The driver connects to one runtime: Local Chromium, Browser Use Cloud, or an existing CDP browser. Below, an optional Bash tool runs beside the SDK process and can write local files on the SDK host. Footnote: browsers launched by the driver close on exit, while an existing CDP browser is borrowed and not shut down by the driver.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .kicker { font-size: 18px; font-weight: 600; letter-spacing: 3px; }
      .cap { font-size: 18px; fill: #6E6A5C; }
      .core { font-size: 24px; font-weight: 600; fill: #1E3B2C; }
    </style>
    <marker id="arrowForest" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1.5 L11 6 L1 10.5 Z" fill="#1E3B2C"/>
    </marker>
    <marker id="arrowClay" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1.5 L11 6 L1 10.5 Z" fill="#B95A38"/>
    </marker>
    <marker id="arrowSmall" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1.5 L11 6 L1 10.5 Z" fill="#1E3B2C"/>
    </marker>
  </defs>

  <!-- Ground -->
  <rect width="1440" height="900" fill="#F4EDE0"/>

  <!-- Masthead -->
  <rect x="80" y="74" width="28" height="4" fill="#B95A38"/>
  <text x="120" y="82" class="sans kicker" fill="#1E3B2C">BROWSER USE <tspan fill="#B95A38">+</tspan> ANTHROPIC</text>
  <text x="1360" y="82" class="sans cap" text-anchor="end" font-style="italic">Fig. 1</text>

  <text x="80" y="160" class="sans" font-size="60" font-weight="650" letter-spacing="-1.2" fill="#1E3B2C">A browser inside your agent loop</text>
  <text x="80" y="204" class="sans" font-size="22" fill="#6E6A5C">Structured browser actions, driven from the SDK tool runner.</text>

  <!-- Soft plate behind the loop -->
  <ellipse cx="660" cy="470" rx="272" ry="214" fill="#ECE2CF"/>

  <!-- Task ribbon -->
  <text x="80" y="420" class="sans kicker" fill="#B95A38">START</text>
  <path d="M80 440 L380 440 L408 470 L380 500 L80 500 L100 470 Z" fill="#E0CFB2"/>
  <text x="118" y="479" class="sans core">User task</text>
  <text x="80" y="536" class="sans cap" font-style="italic">“Read the top three posts”</text>

  <!-- Agent loop arcs -->
  <path d="M512.3 375.6 A190 150 0 0 1 807.6 375.6" fill="none" stroke="#1E3B2C" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowForest)"/>
  <path d="M807.6 564.4 A190 150 0 0 1 512.3 564.4" fill="none" stroke="#B95A38" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowClay)"/>

  <text x="660" y="298" class="sans" font-size="20" text-anchor="middle" fill="#1E3B2C">31 structured browser actions</text>
  <text x="660" y="658" class="sans" font-size="20" text-anchor="middle" fill="#B95A38">browser state + results</text>
  <text x="660" y="476" class="sans kicker" text-anchor="middle" fill="#1E3B2C" opacity="0.55" letter-spacing="4">AGENT LOOP</text>

  <!-- Runner node -->
  <circle cx="470" cy="470" r="100" fill="#1E3B2C"/>
  <text x="470" y="440" class="sans" font-size="18" text-anchor="middle" fill="#F4EDE0" opacity="0.8">Anthropic</text>
  <text x="470" y="479" class="mono" font-size="26" font-weight="600" text-anchor="middle" fill="#F4EDE0">tool_runner</text>
  <text x="470" y="512" class="sans" font-size="18" text-anchor="middle" fill="#F4EDE0" opacity="0.8">Python SDK</text>

  <!-- Driver node -->
  <circle cx="850" cy="470" r="100" fill="#B95A38"/>
  <text x="850" y="472" class="mono" font-size="26" font-weight="600" text-anchor="middle" fill="#FBF6EC">BrowserUse</text>
  <text x="850" y="504" class="sans" font-size="18" text-anchor="middle" fill="#FBF6EC" opacity="0.85">driver</text>

  <!-- Runtime fan -->
  <text x="1074" y="318" class="sans kicker" fill="#B95A38">ONE RUNTIME</text>
  <path d="M937 420 C990 392 1010 370 1062 370" fill="none" stroke="#1E3B2C" stroke-width="2" marker-end="url(#arrowSmall)"/>
  <path d="M952 470 L1062 470" fill="none" stroke="#1E3B2C" stroke-width="2" marker-end="url(#arrowSmall)"/>
  <path d="M937 520 C990 548 1010 570 1062 570" fill="none" stroke="#1E3B2C" stroke-width="2" marker-end="url(#arrowSmall)"/>

  <!-- Local Chromium -->
  <g>
    <rect x="1074" y="350" width="56" height="40" rx="5" fill="#FBF6EC" stroke="#1E3B2C" stroke-width="2"/>
    <line x1="1074" y1="361" x2="1130" y2="361" stroke="#1E3B2C" stroke-width="2"/>
    <circle cx="1082" cy="355.5" r="1.8" fill="#B95A38"/>
    <circle cx="1088" cy="355.5" r="1.8" fill="#1E3B2C"/>
    <circle cx="1094" cy="355.5" r="1.8" fill="#1E3B2C"/>
    <text x="1150" y="378" class="sans core">Local Chromium</text>
  </g>
  <!-- Browser Use Cloud -->
  <g>
    <rect x="1074" y="450" width="56" height="40" rx="5" fill="#FBF6EC" stroke="#1E3B2C" stroke-width="2"/>
    <line x1="1074" y1="461" x2="1130" y2="461" stroke="#1E3B2C" stroke-width="2"/>
    <circle cx="1082" cy="455.5" r="1.8" fill="#B95A38"/>
    <circle cx="1088" cy="455.5" r="1.8" fill="#1E3B2C"/>
    <circle cx="1094" cy="455.5" r="1.8" fill="#1E3B2C"/>
    <text x="1150" y="478" class="sans core">Browser Use Cloud</text>
  </g>
  <!-- Existing CDP (borrowed, dashed) -->
  <g>
    <rect x="1074" y="550" width="56" height="40" rx="5" fill="none" stroke="#1E3B2C" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="1074" y1="561" x2="1130" y2="561" stroke="#1E3B2C" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="1082" cy="555.5" r="1.8" fill="#B95A38"/>
    <circle cx="1088" cy="555.5" r="1.8" fill="#1E3B2C"/>
    <circle cx="1094" cy="555.5" r="1.8" fill="#1E3B2C"/>
    <text x="1150" y="578" class="sans core">Existing CDP</text>
  </g>

  <!-- Optional Bash branch -->
  <path d="M470 574 L470 720" fill="none" stroke="#1E3B2C" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 8" marker-end="url(#arrowSmall)"/>
  <rect x="440" y="728" width="60" height="44" rx="6" fill="#FBF6EC" stroke="#1E3B2C" stroke-width="2"/>
  <text x="470" y="757" class="mono" font-size="20" font-weight="600" text-anchor="middle" fill="#1E3B2C">&gt;_</text>
  <text x="524" y="758" class="sans core" font-size="26">Bash</text>
  <text x="600" y="757" class="sans kicker" fill="#B95A38" font-size="18">OPTIONAL</text>
  <text x="524" y="788" class="sans cap">runs beside the SDK process</text>

  <path d="M800 750 L860 750" fill="none" stroke="#1E3B2C" stroke-width="2" marker-end="url(#arrowSmall)"/>
  <g fill="#FBF6EC" stroke="#1E3B2C" stroke-width="2" stroke-linejoin="round">
    <path d="M882 726 L904 726 L914 736 L914 768 L882 768 Z"/>
    <path d="M872 734 L894 734 L904 744 L904 776 L872 776 Z"/>
    <path d="M894 734 L894 744 L904 744" fill="none"/>
  </g>
  <text x="934" y="758" class="sans core">local files</text>
  <text x="934" y="788" class="sans cap">on the SDK host</text>

  <!-- Lifecycle footnote -->
  <line x1="80" y1="826" x2="1360" y2="826" stroke="#D9CAB0" stroke-width="1"/>
  <rect x="80" y="848" width="24" height="17" rx="3" fill="#FBF6EC" stroke="#1E3B2C" stroke-width="1.6"/>
  <text x="114" y="862" class="sans cap">Driver-launched browsers close on exit.</text>
  <rect x="490" y="848" width="24" height="17" rx="3" fill="none" stroke="#1E3B2C" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="524" y="862" class="sans cap">An existing CDP browser is borrowed, never shut down by the driver.</text>
</svg>
