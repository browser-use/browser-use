<path d="M440 470 V386" stroke="#a8461f" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#r)"/>
<text x="370" y="430" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#13253d">bash</text>
<text x="450" y="430" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#8a3a18">result</text>

<g>
