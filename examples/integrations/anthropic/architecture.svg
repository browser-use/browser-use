<text x="608" y="302" font-size="54" font-weight="800" fill="#ffffff">31</text>
<text x="682" y="282" font-size="16" font-weight="700" fill="#ffffff">browser</text>
<text x="682" y="302" font-size="16" font-weight="700" fill="#ffffff">actions</text>
