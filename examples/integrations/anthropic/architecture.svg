<text x="318" y="264" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#8a3a18">02 ANTHROPIC SDK</text>
<text x="318" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#13253d">tool_runner</text>
<text x="318" y="326" font-size="14" fill="#33465e">Claude requests a tool,</text>
