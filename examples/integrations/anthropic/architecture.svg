<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="title">Browser Use and Anthropic: tool_runner drives one browser runtime through the Browser Use driver</title>
<desc id="desc">Architecture diagram. Inside your application process, a user task enters the Anthropic Python SDK tool_runner. The runner sends browser tool calls to the Browser Use driver, which implements 31 browser actions, and receives page state back. The driver controls exactly one runtime, chosen from local Chromium, Browser Use Cloud, or an existing local or remote browser over CDP. A separate bounded Bash tool runs beside the SDK process for local computation and files under outputs/. Bash does not copy files to a remote browser host. Your application owns lifecycle: the driver closes a local or Cloud browser it launched, and the application closes a borrowed CDP session.</desc>
<defs>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#f5f8fb"/><path d="M24 0H0V24" fill="none" stroke="#e1e8f0" stroke-width="0.6"/></pattern>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#13253d"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a8461f"/></marker>
<marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#13253d"/></marker>
</defs>
<rect width="1440" height="900" fill="url(#g)"/>

<text x="60" y="72" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2.5" fill="#4a5c73">BROWSER USE × ANTHROPIC · PYTHON SDK</text>
<text x="60" y="114" font-size="36" font-weight="700" fill="#13253d">Claude drives a real browser through one driver</text>
<text x="60" y="146" font-size="17" fill="#33465e">Calls flow right. Page state flows back. Exactly one runtime is attached. Your application owns lifecycle.</text>

