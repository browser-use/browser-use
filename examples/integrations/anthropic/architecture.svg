<line x1="1150" y1="94" x2="1196" y2="94" stroke="#a8461f" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#r)"/><text x="1208" y="98" fill="#8a3a18">state returned</text>
<line x1="1150" y1="120" x2="1196" y2="120" stroke="#13253d" stroke-width="2" stroke-dasharray="3 4"/><text x="1208" y="124">process boundary</text>
</g>

