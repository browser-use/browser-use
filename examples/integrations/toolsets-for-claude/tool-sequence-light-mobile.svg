<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 482" width="360" height="482" role="img" aria-labelledby="t d" fill="none"><title id="t">The tool runner relays Claude's tool calls to the browser and to Bash</title><desc id="d">Claude sends a tool call to the Anthropic SDK tool runner. The runner passes read_page to the browser, shown on news.ycombinator.com, and bash to the SDK host, where it writes hacker-news.md and hacker-news.json. Each result returns through the runner to Claude, and runner.until_done() repeats this until Claude finishes.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#DDD8CD"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.05 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="359" height="481" rx="14"/></clipPath><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5" stroke="#5F5B53" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5" stroke="#9A958A" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5" stroke="#FE750E" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="360" height="482"><feGaussianBlur stdDeviation="4"/></filter></defs><rect x="0.5" y="0.5" width="359" height="481" rx="14" fill="#FBFAF7"/><g clip-path="url(#card)"><rect width="360" height="482" fill="url(#dots)"/><rect width="360" height="482" filter="url(#grain)"/></g><rect x="0.5" y="0.5" width="359" height="481" rx="14" fill="none" stroke="#E6E2D9"/><path d="M15 20h10M20 15v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M335 20h10M340 15v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M15 462h10M20 457v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M335 462h10M340 457v10" stroke="#C9C3B6" stroke-width="0.75"/><text x="34.0" y="24.5" font-size="10" fill="#5F5B53" letter-spacing="0.08em" class="m">FIG 6.1</text><text x="326.0" y="24.5" font-size="10" fill="#5F5B53" text-anchor="end" letter-spacing="0.08em" class="m">CLAUDE / TOOL LOOP</text><polygon points="62.0,74.0 100.1,96.0 62.0,118.0 23.9,96.0" stroke="#9A958A" stroke-width="0.8" stroke-dasharray="2 2"/><polygon points="23.9,71.0 62.0,93.0 62.0,111.0 23.9,89.0" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round"/><polygon points="100.1,71.0 62.0,93.0 62.0,111.0 100.1,89.0" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round"/><polygon points="62.0,49.0 100.1,71.0 62.0,93.0 23.9,71.0" fill="#FFFFFF" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round"/><g transform="matrix(0.8660,0.5,-0.8660,0.5,62.0,49.0)"><path d="M9 10h26a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H18l-5 5v-5H9a3 3 0 0 1-3-3V13a3 3 0 0 1 3-3z" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M11 16.5h20M11 21.5h13" stroke="#C9C3B6" stroke-width="0.9" stroke-linecap="round" vector-effect="non-scaling-stroke"/></g><polygon points="62.0,172.0 100.1,194.0 62.0,216.0 23.9,194.0" stroke="#9A958A" stroke-width="0.8" stroke-dasharray="2 2"/><polygon points="23.9,169.0 62.0,191.0 62.0,209.0 23.9,187.