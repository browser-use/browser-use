<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" width="720" height="312" role="img" aria-labelledby="t d" fill="none"><title id="t">Your confirm callback decides each browser action before the driver executes it</title><desc id="d">Claude requests a browser action. Your confirm(context) callback runs before the driver executes it, once per action. If it returns True, the driver executes the action. If it returns False or raises, no action runs. Either way a tool_result returns to Claude.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes flow{to{stroke-dashoffset:-24}}@media (prefers-reduced-motion:no-preference){.flow{animation:flow 1.6s linear infinite}}@keyframes cur{0%,100%{transform:translate(0,0)}40%{transform:translate(-7px,-5px)}70%{transform:translate(-3px,2px)}}@media (prefers-reduced-motion:no-preference){.cur{animation:cur 6s ease-in-out infinite}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#DDD8CD"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.05 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="719" height="311" rx="14"/></clipPath><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5" stroke="#5F5B53" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5" stroke="#FE750E" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="bar" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="#9A958A"/></pattern><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="312"><feGaussianBlur stdDeviation="3.5"/></filter></defs><rect x="0.5" y="0.5" width="719" height="311" rx="14" fill="#FBFAF7"/><g clip-path="url(#card)"><rect width="720" height="312" fill="url(#dots)"/><rect width="720" height="312" filter="url(#grain)"/></g><rect x="0.5" y="0.5" width="719" height="311" rx="14" fill="none" stroke="#E6E2D9"/><path d="M15 20h10M20 15v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M695 20h10M700 15v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M15 292h10M20 287v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M695 292h10M700 287v10" stroke="#C9C3B6" stroke-width="0.75"/><text x="34.0" y="24.5" font-size="10" fill="#5F5B53" letter-spacing="0.08em" class="m">FIG 6.3</text><text x="686.0" y="24.5" font-size="10" fill="#5F5B53" text-anchor="end" letter-spacing="0.08em" class="m">TOOLSETS FOR CLAUDE / APPROVALS</text><polygon points="100.0,132.0 134.6,152.0 100.0,172.0 65.4,152.0" stroke="#9A958A" stroke-width="0.8" stroke-dasharray="2 2"/><polygon points="65.4,143.0 100.0,163.0 100.0,166.0 65.4,146.0" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round"/><polygon points="134.6,143.0 100.0,163.0 100.0,166.0 134.6,146.0" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round"/><polygon points="100.0,123.0 134.6,143.0 100.0,163.0 65.4,143.0" fill="#FFFFFF" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round"/><polygon points="65.4,130.0 100.0,150.0 100.0,153.0 65.4,133.0" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round"/><polygon points="134.6,130.0 100.0,150.0 100.0,153.0 134.6,133.0" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round"/><polygon points="100.0,110.0 134.6,130.0 100.0,150.0 65.4