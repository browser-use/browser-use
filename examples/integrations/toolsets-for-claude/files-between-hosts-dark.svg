<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" width="720" height="348" role="img" aria-labelledby="t d" fill="none"><title id="t">Files between the SDK host and a remote browser</title><desc id="d">The SDK host and a remote browser host have separate filesystems. Upload: your application copies the file's bytes to the browser host, then the driver's file_upload passes an approved document ID that resolves to the staged path. Download: the driver's download notice carries only a path on the browser host; your application retrieves the bytes to the SDK host.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes fw{to{stroke-dashoffset:-24}}@keyframes blink{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}@media (prefers-reduced-motion:no-preference){.fw{animation:fw 1.3s linear infinite}.blink{animation:blink 1.1s steps(1) infinite}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#232328"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.07 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="719" height="347" rx="14"/></clipPath><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#A1A1AA" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#FE750E" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="348"><feGaussianBlur stdDeviation="4"/></filter></defs><rect x="0.5" y="0.5" width="719" height="347" rx="14" fill="#111113"/><g clip-path="url(#card)"><rect width="720" height="348" fill="url(#dots)"/><rect width="720" height="348" filter="url(#grain)"/></g><rect x="0.5" y="0.5" width="719" height="347" rx="14" fill="none" stroke="#26262B"/><path d="M15 20h10M20 15v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M695 20h10M700 15v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M15 328h10M20 323v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M695 328h10M700 323v10" stroke="#3D3D45" stroke-width="0.75"/><text x="34.0" y="24.5" font-size="10" fill="#A1A1AA" letter-spacing="0.08em" class="m">FIG 6.2</text><text x="686.0" y="24.5" font-size="10" fill="#A1A1AA" text-anchor="end" letter-spacing="0.08em" class="m">CLAUDE TOOLSETS / FILES</text><polyline points="90.7,81.0 173.9,129.0 229.3,97.0" stroke="#3D3D45" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round" stroke-linecap="round"/><polygon points="229.3,85.0 173.9,117.0 173.9,126.0 229.3,94.0" fill="#1A1A1E" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="90.7,69.0 173.9,117.0 173.9,126.0 90.7,78.0" fill="#1A1A1E" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="146.1,37.0 229.3,85.0 173.9,117.0 90.7,69.0" fill="#151518" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><g transform="matrix(0.8660,0.5,-0.8660,0.5,146.1,37.0)"><line x1="10" y1="10.0" x2="54.7" y2="10.0" stroke="#3D3D45" stroke-width="0.9" stroke-linecap="round" vector-effect="non-scaling-stroke"/><line x1="10" y1="19.2" x2="70.3" y2="19.2" stroke="#3D3D45" stroke-width="0.9" stroke-linecap="round" vector-effect="non-scaling-stroke"/><line x1="16" y1="28.4" x2="67.3" y2="28.4" stroke="#FE750E" stroke-width="