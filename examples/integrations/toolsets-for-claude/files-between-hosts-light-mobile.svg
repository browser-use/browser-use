<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320" role="img" aria-labelledby="t d" fill="none"><title id="t">Files between the SDK host and a remote browser</title><desc id="d">The SDK host and a remote browser host have separate filesystems. Upload: your application copies the file's bytes to the browser host, then the driver's file_upload passes an approved document ID that resolves to the staged path. Download: the driver's download notice carries only a path on the browser host; your application retrieves the bytes to the SDK host.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}@keyframes fw{to{stroke-dashoffset:-24}}@keyframes blink{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}@media (prefers-reduced-motion:no-preference){.fw{animation:fw 1.3s linear infinite}.blink{animation:blink 1.1s steps(1) infinite}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#DDD8CD"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.05 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="359" height="319" rx="14"/></clipPath><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#5F5B53" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" stroke="#FE750E" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></marker><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="360" height="320"><feGaussianBlur stdDeviation="4"/></filter></defs><rect x="0.5" y="0.5" width="359" height="319" rx="14" fill="#FBFAF7"/><g clip-path="url(#card)"><rect width="360" height="320" fill="url(#dots)"/><rect width="360" height="320" filter="url(#grain)"/></g><rect x="0.5" y="0.5" width="359" height="319" rx="14" fill="none" stroke="#E6E2D9"/><path d="M11 16h10M16 11v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M339 16h10M344 11v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M11 304h10M16 299v10" stroke="#C9C3B6" stroke-width="0.75"/><path d="M339 304h10M344 299v10" stroke="#C9C3B6" stroke-width="0.75"/><text x="28.0" y="24.5" font-size="10" fill="#5F5B53" letter-spacing="0.08em" class="m">FIG 6.2</text><text x="332.0" y="24.5" font-size="10" fill="#5F5B53" text-anchor="end" letter-spacing="0.08em" class="m">FILES</text><polyline points="30.0,79.0 92.4,115.0 134.0,91.0" stroke="#C9C3B6" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round" stroke-linecap="round"/><polygon points="134.0,79.0 92.4,103.0 92.4,112.0 134.0,88.0" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="30.0,67.0 92.4,103.0 92.4,112.0 30.0,76.0" fill="#F4F1EA" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="71.6,43.0 134.0,79.0 92.4,103.0 30.0,67.0" fill="#FFFFFF" stroke="#5F5B53" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/><g transform="matrix(0.8660,0.5,-0.8660,0.5,71.6,43.0)"><line x1="10" y1="10.0" x2="43.5" y2="10.0" stroke="#C9C3B6" stroke-width="0.9" stroke-linecap="round" vector-effect="non-scaling-stroke"/><line x1="10" y1="16.0" x2="55.2" y2="16.0" stroke="#C9C3B6" stroke-width="0.9" stroke-linecap="round" vector-effect="non-scaling-stroke"/><line x1="16" y1="22.0" x2="54.5" y2="22.0" stroke="#FE750E" stroke-width="1.4" stroke-linecap="round