<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d" fill="none"><title id="t">The tool runner relays Claude's tool calls to the browser and to Bash</title><desc id="d">Claude sends a tool call to the Anthropic SDK tool runner. The runner passes read_page to the browser, shown on news.ycombinator.com, and bash to the SDK host, where it writes hacker-news.md and hacker-news.json. Each result returns through the runner to Claude, and runner.until_done() repeats this until Claude finishes.</desc><style>.s{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}text{font-kerning:normal}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.7" fill="#232328"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.07 0"/></filter><clipPath id="card"><rect x="0.5" y="0.5" width="719" height="299" rx="14"/></clipPath><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5" stroke="#A1A1AA" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5" stroke="#6B6B74" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L9 5 L1 8.5" stroke="#FE750E" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="300"><feGaussianBlur stdDeviation="4"/></filter></defs><rect x="0.5" y="0.5" width="719" height="299" rx="14" fill="#111113"/><g clip-path="url(#card)"><rect width="720" height="300" fill="url(#dots)"/><rect width="720" height="300" filter="url(#grain)"/></g><rect x="0.5" y="0.5" width="719" height="299" rx="14" fill="none" stroke="#26262B"/><path d="M15 20h10M20 15v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M695 20h10M700 15v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M15 280h10M20 275v10" stroke="#3D3D45" stroke-width="0.75"/><path d="M695 280h10M700 275v10" stroke="#3D3D45" stroke-width="0.75"/><text x="34.0" y="24.5" font-size="10" fill="#A1A1AA" letter-spacing="0.08em" class="m">FIG 6.1</text><text x="686.0" y="24.5" font-size="10" fill="#A1A1AA" text-anchor="end" letter-spacing="0.08em" class="m">CLAUDE TOOLSETS / TOOL LOOP</text><polygon points="112.0,152.0 150.1,174.0 112.0,196.0 73.9,174.0" stroke="#6B6B74" stroke-width="0.8" stroke-dasharray="2 2"/><polygon points="73.9,149.0 112.0,171.0 112.0,189.0 73.9,167.0" fill="#1A1A1E" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round"/><polygon points="150.1,149.0 112.0,171.0 112.0,189.0 150.1,167.0" fill="#1A1A1E" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round"/><polygon points="112.0,127.0 150.1,149.0 112.0,171.0 73.9,149.0" fill="#151518" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round"/><g transform="matrix(0.8660,0.5,-0.8660,0.5,112.0,127.0)"><path d="M9 10h26a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H18l-5 5v-5H9a3 3 0 0 1-3-3V13a3 3 0 0 1 3-3z" fill="#1A1A1E" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M11 16.5h20M11 21.5h13" stroke="#3D3D45" stroke-width="0.9" stroke-linecap="round" vector-effect="non-scaling-stroke"/></g><polygon points="314.0,152.0 352.1,174.0 314.0,196.0 275.9,174.0" stroke="#6B6B74" stroke-width="0.8" stroke-dasharray="2 2"/><polygon points="275.9,1